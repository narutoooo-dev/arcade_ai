name: Windows installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach the installer to (e.g. v1.2.1)"
        required: true
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build windows --release

      - name: Read version from pubspec
        id: ver
        shell: bash
        run: echo "version=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)" >> "$GITHUB_OUTPUT"

      - name: Compile installer (Inno Setup)
        shell: bash
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: '"/c/Program Files (x86)/Inno Setup 6/ISCC.exe" windows/installer.iss'

      - name: Attach installer to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$TAG" windows/Output/ArcadeAI-Setup-*.exe --clobber
