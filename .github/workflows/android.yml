name: Android Build

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'lib/**'
      - 'pubspec.yaml'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK (Unsigning)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Verify Flutter setup
        run: flutter doctor -v
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Analyze code (non-fatal)
        run: |
          echo "🔍 Running flutter analyze (info-level issues are ignored)"
          flutter analyze --no-fatal-infos --no-fatal-warnings || true
        continue-on-error: true
      
      - name: Run tests (non-fatal)
        run: |
          echo "🧪 Running tests..."
          flutter test || true
        continue-on-error: true
      
      - name: Clean project
        run: flutter clean
      
      # ✅ طريقة آمنة للبناء بدون توقيع
      - name: Build debug APK
        run: flutter build apk --debug --split-per-abi
      
      - name: Build release APK (unsigned)
        run: |
          # تحقق من وجود الملف
          ls -la android/app/
          
          # تعطيل التوقيع في build.gradle
          if [ -f "android/app/build.gradle" ]; then
            # إنشاء نسخة احتياطية
            cp android/app/build.gradle android/app/build.gradle.bak
            
            # إزالة سطر التوقيع
            sed -i '/signingConfig signingConfigs.release/d' android/app/build.gradle
            
            # بناء APK
            flutter build apk --release --split-per-abi
            
            # استعادة الملف الأصلي
            mv android/app/build.gradle.bak android/app/build.gradle
          else
            echo "❌ ملف build.gradle غير موجود!"
            exit 1
          fi
      
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: build/app/outputs/flutter-apk/*-debug.apk
      
      - name: Upload release APKs (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: release-unsigned-apks
          path: build/app/outputs/flutter-apk/*-release.apk
      
      - name: Build App Bundle (unsigned)
        run: |
          if [ -f "android/app/build.gradle" ]; then
            cp android/app/build.gradle android/app/build.gradle.bak
            sed -i '/signingConfig signingConfigs.release/d' android/app/build.gradle
            flutter build appbundle --release
            mv android/app/build.gradle.bak android/app/build.gradle
          fi
      
      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle-unsigned
          path: build/app/outputs/bundle/release/*.aab

  create-release:
    name: Create Release
    needs: build-android
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Download release APKs
        uses: actions/download-artifact@v4
        with:
          name: release-unsigned-apks
          path: release-apks
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            ## 📱 Arcade AI - Release v${{ github.run_number }}
            
            ### 🚀 ما الجديد؟
            - إصدار مستقر من فرع `main`
            - بني تلقائياً بواسطة GitHub Actions
            
            ### 📦 الملفات المتاحة
            - `app-arm64-v8a-release.apk` - لأجهزة 64-bit (معظم الأجهزة الحديثة)
            - `app-armeabi-v7a-release.apk` - لأجهزة 32-bit (الأقدم)
            - `app-x86_64-release.apk` - للمحاكيات
            
            ### ⚠️ ملاحظات التثبيت
            1. حمّل ملف APK المناسب لجهازك
            2. انقله إلى هاتفك
            3. فعّل "التثبيت من مصادر غير معروفة" في الإعدادات
            4. ثبّت التطبيق
            
            ### 🔧 الميزات
            - دعم 12 مزود خدمة
            - بث حي للرسائل
            - عرض منطق التفكير للنماذج الذكية
            - دعم الرؤية (إرفاق الصور)
            - واجهة مظلمة مع تأثيرات حركية
            
            ### 📝 ملاحظة
            هذا الإصدار **غير موقع** (unsigned) - مناسب للتجربة والاختبار.
          files: release-apks/*.apk
          draft: false
          prerelease: false
          target_commitish: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
