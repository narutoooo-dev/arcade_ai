name: Android Build

on:
  push:
    branches: [ main ]  # الفرع الرئيسي main
    paths:
      - 'android/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [ main ]  # الفرع الرئيسي main
    paths:
      - 'android/**'
      - 'lib/**'
      - 'pubspec.yaml'
  workflow_dispatch: # يسمح بتشغيل يدوي

jobs:
  build-android:
    name: Build Android APK (Unsigning)
    runs-on: ubuntu-latest
    
    steps:
      # 1. استنساخ المستودع
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. إعداد Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      # 3. إعداد Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      # 4. التحقق من بيئة Flutter
      - name: Verify Flutter setup
        run: flutter doctor -v
      
      # 5. تحميل الاعتماديات
      - name: Get dependencies
        run: flutter pub get
      
      # 6. تحليل الكود (تجاهل التحذيرات info-level)
      - name: Analyze code (non-fatal)
        run: |
          echo "🔍 Running flutter analyze (info-level issues are ignored)"
          flutter analyze --no-fatal-infos --no-fatal-warnings || true
        continue-on-error: true  # يستمر حتى مع وجود تحذيرات
      
      # 7. تشغيل الاختبارات (تجاهل الفشل)
      - name: Run tests (non-fatal)
        run: |
          echo "🧪 Running tests..."
          flutter test || true
        continue-on-error: true
      
      # 8. تنظيف المشروع قبل البناء
      - name: Clean project
        run: flutter clean
      
      # 9. بناء APK للتطوير (غير موقع) مع تقسيم حسب المعمارية
      - name: Build debug APK
        run: flutter build apk --debug --split-per-abi
      
      # 10. بناء APK للإصدار (غير موقع) - بدون توقيع
      - name: Build release APK (unsigned)
        run: flutter build apk --release --split-per-abi --no-sign
        # --no-sign يمنع محاولة التوقيع، مما يلغي الحاجة لـ keystore
      
      # 11. رفع ملفات APK كـ Artifacts
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: build/app/outputs/flutter-apk/*-debug.apk
      
      - name: Upload release APKs (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: release-unsigned-apks
          path: build/app/outputs/flutter-apk/*-release.apk
      
      # 12. بناء App Bundle (للإصدار لمتجر Play) - اختياري
      - name: Build App Bundle (unsigned)
        run: flutter build appbundle --release --no-sign
      
      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle-unsigned
          path: build/app/outputs/bundle/release/*.aab

  # وظيفة لنشر إصدار تلقائي للـ main branch
  create-release:
    name: Create Release
    needs: build-android
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Download release APKs
        uses: actions/download-artifact@v4
        with:
          name: release-unsigned-apks
          path: release-apks
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            ## 📱 Arcade AI - Release v${{ github.run_number }}
            
            ### 🚀 ما الجديد؟
            - إصدار مستقر من فرع `main`
            - بني تلقائياً بواسطة GitHub Actions
            
            ### 📦 الملفات المتاحة
            - `app-arm64-v8a-release.apk` - لأجهزة 64-bit (معظم الأجهزة الحديثة)
            - `app-armeabi-v7a-release.apk` - لأجهزة 32-bit (الأقدم)
            - `app-x86_64-release.apk` - للمحاكيات
            
            ### ⚠️ ملاحظات التثبيت
            1. حمّل ملف APK المناسب لجهازك
            2. انقله إلى هاتفك
            3. فعّل "التثبيت من مصادر غير معروفة" في الإعدادات
            4. ثبّت التطبيق
            
            ### 🔧 الميزات
            - دعم 12 مزود خدمة
            - بث حي للرسائل
            - عرض منطق التفكير للنماذج الذكية
            - دعم الرؤية (إرفاق الصور)
            - واجهة مظلمة مع تأثيرات حركية
            
            ### 📝 ملاحظة
            هذا الإصدار **غير موقع** (unsigned) - مناسب للتجربة والاختبار.
          files: release-apks/*.apk
          draft: false
          prerelease: false  # إصدار نهائي (ليس تجريبي)
          target_commitish: main  # الإصدار من فرع main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
